<!DOCTYPE html>
<html>
  <head>
    <title>Wiktoria Kiedrowicz - Portfolio</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, minimal-ui" />
    <meta name="robots" content="noimageindex" />
    <link rel="stylesheet" href="./bulma.min.css">
    <link rel="stylesheet" href="./flipbook.min.css">
  </head>

  <body>
    <div class="is-relative is-flex image-wrapper" id="parent">
      <img src="book1.jpg" class="book-image" id="workaround">
      <div class="c-flipbook at-front-cover is-ready" id="FlipBook"></div>
      <div class="book-gutter" id="gutter"></div>
    </div>
    <script src="./flipbook.umd.min.js"></script>
    <script>

      const target = document.getElementById("FlipBook");
      const gutter = document.getElementById("gutter");
      const workaround = document.getElementById("workaround");

      const firstPage = document.createElement("div");
      firstPage.className = "c-flipbook__page first-page";
      const firstImg = document.createElement("img");
      firstImg.src = "./1.jpg";
      firstImg.className = "image";
      firstPage.appendChild(firstImg);
      target.appendChild(firstPage);

      for(var i = 2; i < 48; i++) {
        const page = document.createElement("div");
        page.className = "c-flipbook__page";
        const img = document.createElement("img");
        img.src = "./" + i + ".jpg";
        img.className = "image";
        page.appendChild(img);
        target.appendChild(page);
      }

      const lastPage = document.createElement("div");
      lastPage.className = "c-flipbook__page last-page";
      const lastImg = document.createElement("img");
      lastImg.src = "./48.jpg";
      lastImg.className = "image";
      lastPage.appendChild(lastImg);
      target.appendChild(lastPage);

      gutter.style.visibility = 'hidden';
      workaround.style.visibility = 'hidden';

      window.book = new FlipBook('FlipBook', {
        canClose: true,
        initialCall: true,
        onPageTurn: function(a, b) {
          const first = b.children[0];
          const last = b.children[b.children.length-1];
          console.log('last', last);
          if(first.classList.contains("is-active") ||
             last.classList.contains("is-active") ||
             last.classList.contains("is-animating") ||
             first.classList.contains("is-animating"))
          {
            gutter.style.visibility = 'hidden';
            workaround.style.visibility = 'hidden';
          }
          else {
            setTimeout(function() {
              if(first.classList.contains("is-active") ||
               last.classList.contains("is-active") ||
               last.classList.contains("is-animating") ||
               first.classList.contains("is-animating"))
              {

              }
              else
              {
                gutter.style.visibility = 'visible';
                workaround.style.visibility = 'visible';
              }
            }, 500);
          }
        }
      });
    </script>
    <style>
      html, body {
        background-color: darkgray;
      }

      #parent {
        margin: 48px 48px 0px 48px;
        max-width: 4000px;
      }

      .image-wrapper {
        position: relative;
        display: inline-block;
        line-height: 0;
      }

      .book-image {
        display: block;
        width: 100%;
        height: auto;
      }

      .book-gutter {
        position: absolute;

        /* 201px wide in the original 4000px image */
        width: 1.025%;

        /* Full image height */
        top: 0;
        bottom: 0;

        /* Exactly the middle */
        left: 50%;
        transform: translateX(-50%);

        background: rgba(0, 0, 0, 0.25);
        filter: blur(15px);
        mix-blend-mode: multiply;

        pointer-events: none;
      }

    </style>
  </body>
</html>
