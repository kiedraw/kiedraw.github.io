    <script src="./flipbook.umd.min.js"></script>
    <script>

      const target = document.getElementById("FlipBook");

      const firstPage = document.createElement("div");
      firstPage.className = "c-flipbook__page first-page";
      const firstImg = document.createElement("img");
      firstImg.src = "./1.jpg";
      firstImg.className = "image";
      firstPage.appendChild(firstImg);
      target.appendChild(firstPage);

      for(var i = 2; i < 70; i++) {
        const page = document.createElement("div");
        page.className = "c-flipbook__page";
        const img = document.createElement("img");
        img.src = "./" + i + ".jpg";
        img.className = "image";
        page.appendChild(img);
        target.appendChild(page);
      }

      const lastPage = document.createElement("div");
      lastPage.className = "c-flipbook__page last-page";
      const lastImg = document.createElement("img");
      lastImg.src = "./70.jpg";
      lastImg.className = "image";
      lastPage.appendChild(lastImg);
      target.appendChild(lastPage);

      window.book = new FlipBook('FlipBook', {
        canClose: true,
        initialCall: true,
      });
    </script>
    <style>
